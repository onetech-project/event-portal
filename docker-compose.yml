# Application stack. The observability stack lives in docker-compose.observability.yml
# and is opted into with:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Keeping them separate means the day-to-day `docker compose up` stays fast and
# does not require six extra containers to run the app.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Read cache for the list endpoints (Constitution Principle VII). Deliberately
  # unconfigured for durability: the cache holds nothing that is not already in
  # Postgres, so AOF/RDB would buy nothing and cost restart time. Bounded memory
  # with LRU eviction instead, so a long-lived instance cannot grow without limit.
  #
  # Note there is no `depends_on` from api to here, and that is the point: Redis
  # is a soft dependency and the API must start and serve without it.
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Schema owner. Runs to completion before the API is allowed to start, so the
  # binary never serves against a schema it was not built for.
  #
  # This replaces the old /docker-entrypoint-initdb.d mount, which Postgres runs
  # only on an empty data volume: a second migration was silently never applied to
  # a database that already existed. golang-migrate records every applied version
  # in schema_migrations instead, so it can tell.
  migrate:
    image: migrate/migrate:v4.19.0
    container_name: ticketing-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    # One-shot: it exits, and must not be restarted into a no-op loop.
    restart: "no"
    # -path and -database belong to the entrypoint, not the command, so that
    # `docker compose run --rm migrate <subcommand>` overrides only the
    # subcommand — `run … migrate version` and `run … migrate force 2` both work
    # without repeating the connection string.
    entrypoint:
      - "migrate"
      - "-path=/migrations"
      - "-database=postgres://ticketing:ticketing@postgres:5432/ticketing?sslmode=disable"
    command: ["up"]

  api:
    build:
      context: ./backend
      args:
        VERSION: ${SERVICE_VERSION:-dev}
    container_name: ticketing-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://ticketing:ticketing@postgres:5432/ticketing?sslmode=disable
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      # Payment gateway. PG_BASE_URL and PG_CALLBACK_TOKEN have no default here
      # on purpose — the API refuses to start without them, which is the whole
      # point of FR-026. A `:-` fallback would substitute a value the operator
      # never chose and turn a boot failure into a live misdirection.
      PG_BASE_URL: ${PG_BASE_URL}
      PG_SERVER_KEY: ${PG_SERVER_KEY:-}
      PG_CLIENT_KEY: ${PG_CLIENT_KEY:-}
      PG_CALLBACK_TOKEN: ${PG_CALLBACK_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-tickets@example.com}
      # Read cache (Principle VII). Set CACHE_ENABLED=false, or blank REDIS_URL,
      # to return the API to direct database reads on every request.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-10m}
      # Empty by default: without the observability stack up there is no
      # collector to export to, and the service must not block waiting for one.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # Host port is configurable so the stack can coexist with an API you are
      # already running locally on 8080.
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time, so changing it needs a rebuild.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: ticketing-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # Local mail catcher so the post-payment email path can be exercised without a
  # real SMTP account. UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
