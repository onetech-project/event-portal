  /api/v1/admin/ticket-types:
    get:
      tags: [Admin - Ticket Types]
      summary: List ticket types
      operationId: adminListTicketTypes
      security: [{ adminAuth: [] }]
      description: '`event_id` is required — there is no unscoped listing.'
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event's ticket types.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketTypeAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin - Ticket Types]
      summary: Create a ticket type
      operationId: adminCreateTicketType
      security: [{ adminAuth: [] }]
      description: |
        `quota` on create is the allocation; from then on the stored value is what **remains**.

        `event_start` / `event_end` bound when the ticket **admits**, not showtime — validation
        admits no tolerance, so an admin who sets `event_start` to showtime turns away every early
        arrival. The window must sit inside the parent event's dates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTypeRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketTypeAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/ticket-types/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Admin - Ticket Types]
      summary: Get a ticket type
      operationId: adminGetTicketType
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: The ticket type.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketTypeAdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Ticket Types]
      summary: Update a ticket type
      operationId: adminUpdateTicketType
      security: [{ adminAuth: [] }]
      description: |
        Full replacement. `event_id` is ignored — a ticket type does not move between events.
        Writing `quota` sets the **remaining** count, not an allocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTypeRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketTypeAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin - Ticket Types]
      summary: Delete a ticket type
      operationId: adminDeleteTicketType
      security: [{ adminAuth: [] }]
      description: Guarded against deleting a type that has been sold or that a package draws on.
      responses:
