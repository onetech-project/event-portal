openapi: 3.0.3

info:
  title: Manjo Ticketing API
  version: 1.0.0
  description: |
    Complete HTTP surface of the Go API (`backend/`).

    ## The envelope

    Every JSON endpoint answers `{ "code": 200000, "message": "Success", "data": ... }` on success
    and `{ "code": <error code>, "message": ..., "data": ... }` on failure — the HTTP status line
    and the envelope code both carry meaning, and a client that branches only on status will miss
    distinctions the numeric code makes.

    Two endpoints sit outside it: `GET /healthz` (bare JSON, read by orchestrators) and
    `GET /api/v1/ticket/order/{order_id}/qris.png` (a PNG).

    ## Identifiers

    Public routes address an **event by its slug** and an **order by its order number**. Admin
    routes address everything by **UUID**. The two namespaces are not interchangeable — an order
    has both a public order number and an admin-side UUID, and passing one where the other is
    expected is a 400 or a 404, never a silent success.

    ## Authentication

    `/api/v1/admin/*` requires a bearer JWT from `POST /api/v1/admin/login`. `POST /v1.0/callback/exec`
    is the payment gateway's own endpoint and authenticates with a *different* bearer credential
    (`PG_CALLBACK_TOKEN`). Everything else is deliberately unauthenticated — the guest purchase
    journey has no accounts (Constitution Principle VI).

    ## Rate limits

    Booking, availability, checkout, ticket lookup and the guest resend each sit behind their own
    per-IP budget, and the SSE status stream caps concurrent connections per IP rather than
    requests per second. A 429 from any of them is the server working as designed.

    ## Suggested order

    `admin/login` → create event → create ticket type → author terms → `ticket/availability` →
    `ticket/book` → record agreement → `ticket/order/{order_id}` → `ticket/checkout/{order_id}` →
    gateway settlement notification. Tickets are issued by the settlement notification and by
    nothing else.

  contact:
    name: Manjo Ticketing
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development — APP_PORT in backend/.env

security: []

tags:
  - name: Health & Ops
    description: Liveness and instrumentation. Mounted at the root, not under /api/v1.
  - name: Public - Catalogue
    description: The unauthenticated browse surface. Events are addressed by slug here, never by UUID.
  - name: Public - Booking & Checkout
    description: |
      The guest purchase journey, in order. An order is addressed by its order number throughout.
  - name: Public - Tickets
    description: Post-purchase guest self-service.
  - name: Payment Gateway
    description: |
      The provider's own callback. Not part of the app's API surface — documented so the
      settlement path can be exercised without the real gateway.
  - name: Admin - Auth
    description: The one /admin/* route reachable without a token.
  - name: Admin - Events
    description: Event CRUD.
  - name: Admin - Ticket Types
    description: Ticket type CRUD. `quota` is REMAINING quota, never an original allocation.
  - name: Admin - Packages
    description: Bundle CRUD. A package holds no quota of its own — it draws on its constituents.
  - name: Admin - Event Content
    description: The authored CMS content behind the public event page.
  - name: Admin - Orders & Attendees
    description: |
      Read-only views over sales. Nothing here writes order or payment state — that has exactly
      one trigger, a notification from the gateway.
  - name: Admin - Fees
    description: Order-level fees, frozen onto an order at booking time.
  - name: Admin - Ticket Validation
    description: The door flow.
  - name: Admin - Payment Ops
    description: Order-scoped reads for an operator working a stuck payment.

paths:
  /healthz:
    get:
      tags: [Health & Ops]
      summary: Health check
      operationId: health
      description: |
        Pings Postgres, then Redis if the list cache is enabled.

        `degraded` is a deliberate 200: the cache fails open, so a Redis outage does not stop the
        API serving (Principle VII).
      responses:
        '200':
          description: Postgres reachable. `cache` is present only when Redis is not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  cache:
                    type: string
                    enum: [unavailable]
              examples:
                ok:
                  value: { status: ok }
                degraded:
                  value: { status: degraded, cache: unavailable }
        '503':
          description: The database is not reachable (`DATABASE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      tags: [Health & Ops]
      summary: Prometheus metrics
      operationId: metrics
      description: |
        Registered only when `METRICS_ENABLED=true`. Carries the HTTP middleware histograms and
        the cache hit/miss counters.
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  /v1.0/callback/exec:
    post:
      tags: [Payment Gateway]
      summary: Payment settlement notification
      operationId: gatewayCallback
      security:
        - gatewayCallbackAuth: []
      description: |
        Where the gateway delivers payment notifications. Mounted at the root, **not** under
        /api/v1 — the path is fixed by the provider's dispatch code and is not ours to choose.

        Authenticated by a bearer token compared in constant time (`PG_CALLBACK_TOKEN`), and by
        nothing else: the body carries no signature and no digest, so the token is the whole
        mechanism. A body that cannot be parsed cannot be authenticated either, and is refused on
        the same footing as a bad token.

        **Almost everything answers 200.** The gateway retries any non-200 three times, ten seconds
        apart, with no dead-letter — so a refusal it cannot act on costs four deliveries and still
        loses the notification. Unknown reference, withdrawal, unrecognised status and
        already-final order are therefore all durably recorded and answered 200. Non-200 is
        reserved for a failed token and for internal faults where a retry genuinely helps.

        A settled deposit is the **only** trigger for ticket issuance. No admin action stands in
        for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayNotification'
      responses:
        '200':
          description: |
            Recorded. Covers settlement, and equally every notification that changed nothing.
        '401':
          description: The notification could not be authenticated. Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An internal fault. The gateway's retry is worth taking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/event:
    get:
      tags: [Public - Catalogue]
      summary: List published events
      operationId: listPublishedEvents
      description: |
        Every PUBLISHED event. Served from the Redis list cache when enabled; a miss or an outage
        falls through to Postgres rather than failing.
      responses:
        '200':
          description: The published catalogue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventSummary'

  /api/v1/event/{slug}:
    get:
      tags: [Public - Catalogue]
      summary: Get event by slug
      operationId: getEventBySlug
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      description: |
        Content-only detail page: description, venue, dates, scale, and the CMS blocks.

        Ticket types and packages are deliberately **not** included — they have their own
        endpoints, so only the selection page pays for live-quota reads.

        `has_terms: false` means booking will be refused (409001) until an admin authors Terms &
        Conditions.
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ticket/{slug}:
    get:
      tags: [Public - Catalogue]
      summary: List ticket types for an event
      operationId: listTicketTypes
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      description: |
        Sellable ticket types with **remaining** quota and the per-ticket admission window
        (`event_start` / `event_end`), which is the ticket's own window and not the parent event's
        dates.
      responses:
        '200':
          description: Ticket types on sale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketTypeSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/packages/{slug}:
    get:
      tags: [Public - Catalogue]
      summary: List packages for an event
      operationId: listPackages
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      description: |
        Active bundles. A package has no quota of its own — `available_units` is derived from the
        remaining quota of its constituents, and the binding one is the answer.
      responses:
        '200':
          description: Bundles on sale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ticket/terms-condition/{id}:
    get:
      tags: [Public - Catalogue]
      summary: Get Terms & Conditions for an event
      operationId: getEventTerms
      parameters:
        - name: id
          in: path
          required: true
          description: The event **slug**.
          schema:
            type: string
          example: jazz-night-2026
      description: |
        The current T&C document shown by the booking dialog. `content` is sanitized HTML.

        Echo `id` back as `event_terms_id` when recording agreement, so the server can detect the
        document changing mid-flow.
      responses:
        '200':
          description: The current document.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventTerms'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Public - Booking & Checkout]
      summary: Record the guest's agreement to the terms
      operationId: recordAgreement
      parameters:
        - name: id
          in: path
          required: true
          description: The **order number**, not an event slug.
          schema:
            type: string
          example: ORD-20261201-0001
      description: |
        Stamps the order with the guest's agreement.

        `event_terms_id` is the id the dialog displayed. If the admin has edited the document
        since, the server answers 409002 rather than recording agreement to text the guest never
        saw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementRequest'
      responses:
        '200':
          description: Agreement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The terms document changed since it was displayed (409002).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/ticket/availability:
    post:
      tags: [Public - Booking & Checkout]
      summary: Check whether a selection can still be bought
      operationId: checkAvailability
      description: |
        The pre-flight check in front of the Terms & Conditions gate.

        **A refusal is a 200.** The question was well formed and correctly answered, and the
        decision body carries every reason at once — which an error envelope could not, since it
        holds a single code. A guest fixing their selection one rejected line per attempt is the
        experience this endpoint exists to remove. Only a malformed request is a 4xx.

        Advisory and transient: nothing is reserved, nothing is stored, and a `true` answer confers
        no right to book — between this call and the guest's Agree click another buyer can take the
        last seat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionRequest'
      responses:
        '200':
          description: The decision, available or not.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AvailabilityDecision'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/ticket/book:
    post:
      tags: [Public - Booking & Checkout]
      summary: Book — create a pending order and hold quota
      operationId: book
      description: |
        Creates a PENDING order and holds quota for an hour. **201**, not 200.

        `order_id` in the response is the public order number every later `/ticket/...` call
        carries. No buyer or holder identity yet — those arrive with checkout.

        Refused with 409001 if the event has no authored Terms & Conditions: there would be nothing
        for the guest to have agreed to.

        For a bundle, send `package_id` instead of `ticket_type_id` on the item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionRequest'
      responses:
        '201':
          description: The order was created and quota is held.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Not bookable — no authored terms (409001), a line no longer on sale, or not enough
            quota remaining.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/ticket/genders:
    get:
      tags: [Public - Booking & Checkout]
      summary: List genders
      operationId: listGenders
      description: |
        The gender master list the holder forms build their options from. Checkout submits the
        **name**, not the id.
      responses:
        '200':
          description: The master list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GenderOption'

  /api/v1/ticket/order/{order_id}:
    get:
      tags: [Public - Booking & Checkout]
      summary: Get the guest's order
      operationId: getOrderDetail
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      description: |
        The guest's own order page. Polled while pending, so it is a few indexed reads with no
        provider call and no writes; answered `Cache-Control: no-store`.

        `slots` is one holder slot per seat — its `id` is what the checkout body addresses.
        `server_time` is paired with `payment.expires_at` so a countdown survives a wrong device
        clock. `payment` is present only while the order is actually payable.
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicOrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ticket/order/{order_id}/qris.png:
    get:
      tags: [Public - Booking & Checkout]
      summary: Render the payment QR as a PNG
      operationId: getOrderQRImage
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      description: |
        Renders the order's stored QRIS payload as a 512px PNG on demand. Nothing is stored — this
        MVP has no object storage — and the browser never talks to the payment provider.

        Binary, not enveloped. `Cache-Control: private, max-age=60`, short enough that a code which
        has just expired does not linger in a browser cache.
      responses:
        '200':
          description: The QR image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ticket/checkout/{order_id}:
    post:
      tags: [Public - Booking & Checkout]
      summary: Submit holder forms and start payment
      operationId: checkout
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      description: |
        Holder forms and payment start in one call — nothing was persisted before it.

        One entry per slot from `GET /api/v1/ticket/order/{order_id}`, and every slot must be
        filled. There is no buyer block: the topmost holder form doubles as the order's primary
        contact, derived server-side from canonical slot order.

        Opens a QRIS session at the gateway, so it is rate limited per IP. Calling it twice answers
        `PAYMENT_ALREADY_STARTED`, carrying the existing QR payload in the envelope's `data` rather
        than opening a second session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: A payment session is open.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Payment already started, the terms were never agreed, or the order is no longer
            payable. `PAYMENT_ALREADY_STARTED` carries the current QR payload in `data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/ticket/checkout/{order_id}/status:
    get:
      tags: [Public - Booking & Checkout]
      summary: Live payment status (SSE)
      operationId: checkoutStatusStream
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      description: |
        Server-Sent Events: pushes the order's payment status until it settles or expires, so the
        confirmation screen does not have to poll.

        Caps **concurrent connections per IP** rather than requests per second — the cost here is
        held-open sockets, not calls. The connection stays open by design; an API client will look
        like it is hanging.
      responses:
        '200':
          description: An event stream of status frames, interleaved with keep-alives.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many concurrent streams from this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tickets/{code}:
    get:
      tags: [Public - Tickets]
      summary: Look up a ticket by code
      operationId: lookupTicket
      parameters:
        - $ref: '#/components/parameters/TicketCode'
      description: |
        Public ticket lookup. Rate limited per IP (`TICKET_LOOKUP_RATE_LIMIT` /
        `TICKET_LOOKUP_BURST`) so enumerating codes is impractical.
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicTicket'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/ticket/resend-email:
    post:
      tags: [Public - Tickets]
      summary: Resend the tickets to the buyer
      operationId: resendTicketsPublic
      description: |
        Re-sends the tickets to the address **stored on the order**. No address field is read, so
        no caller can redirect the mail.

        **202 for every outcome that names an order** — delivered, unpaid, or no such order — with
        identical bytes, so the endpoint cannot be used to discover which order numbers exist. A
        404 here would be an enumeration oracle. A body that names no order at all is outside that
        rule and is a 400: answering it "accepted" would tell a caller mail is on its way when
        nothing was sent.

        Guarded by a per-order-number cooldown. Every attempt that names an order spends the
        window whatever it finds there, or probing order numbers would be free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicResendRequest'
      responses:
        '202':
          description: |
            Accepted. Identical for every outcome that named an order, including an unknown one.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicResendResponse'
        '400':
          description: No `order_id` was supplied. No cooldown allowance is spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Still within the cooldown. `data.retry_after_seconds` says how long — carried in the
            envelope rather than a header, because a cross-origin page cannot read a header that
            is not in `Access-Control-Expose-Headers`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RetryAfter'

  /api/v1/admin/login:
    post:
      tags: [Admin - Auth]
      summary: Admin login
      operationId: adminLogin
      description: |
        Returns the access token and when it expires, so the client does not have to decode the
        token to know. TTL is `JWT_TTL`.

        There is no sign-up flow — accounts are provisioned out of band with
        `go run ./cmd/seedadmin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Email or password is incorrect. The two are not distinguished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/events:
    get:
      tags: [Admin - Events]
      summary: List events
      operationId: adminListEvents
      security: [{ adminAuth: [] }]
      description: Every event regardless of status, unlike the public list.
      responses:
        '200':
          description: All events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventAdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin - Events]
      summary: Create an event
      operationId: adminCreateEvent
      security: [{ adminAuth: [] }]
      description: |
        `slug` is unique and must be lowercase letters, digits and single hyphens. Uniqueness is
        decided by the constraint rather than a pre-check, because nothing else can decide it
        without a race.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The slug is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Admin - Events]
      summary: Get an event
      operationId: adminGetEvent
      security: [{ adminAuth: [] }]
      description: Full detail, including the event's ticket types with their `sold` counts.
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventAdminDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin - Events]
      summary: Update an event
      operationId: adminUpdateEvent
      security: [{ adminAuth: [] }]
      description: Full replacement — send every field. Invalidates the cached public lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
