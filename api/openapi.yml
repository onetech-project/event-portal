              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/packages:
    get:
      tags: [Admin - Packages]
      summary: List packages
      operationId: adminListPackages
      security: [{ adminAuth: [] }]
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event's packages.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin - Packages]
      summary: Create a package
      operationId: adminCreatePackage
      security: [{ adminAuth: [] }]
      description: |
        `price` is the bundle's all-in price and is deliberately **not** validated against the sum
        of its constituents.

        There is no quota field. Any quota-like key — `quota`, `stock`, `inventory`, `remaining`,
        `capacity` — is **rejected** rather than ignored, because ignoring one would train a client
        to believe packages hold stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PackageAdminView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
