version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
  exclusions:
    rules:
      # sqlc output is machine-generated and not hand-maintained.
      - path: "sql\\.go$|adminsql/|eventsql/|ordersql/|paymentsql/|ticketsql/"
        linters:
          - revive
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
