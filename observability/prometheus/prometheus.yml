global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ticketing-local

scrape_configs:
  # Alloy remote-writes the API's metrics, but scraping directly as well means
  # application metrics survive an Alloy restart.
  - job_name: ticketing-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: ticketing-api

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
